server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://cloud-backend:8080/api/;
    }

    location /health {
        proxy_pass http://cloud-backend:8080/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
